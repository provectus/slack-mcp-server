name: Release

on:
  push:
    tags:
      - 'pv-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.25

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Guard against dirty version stamp
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^pv-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $GITHUB_REF_NAME (expected pv-vX.Y.Z)" >&2
            exit 1
          fi
          desc="$(git describe --tags --always --dirty)"
          echo "git describe: $desc"
          if [[ "$desc" == *-dirty ]]; then
            echo "::error::Working tree is dirty; refusing to stamp a -dirty release version." >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Build binaries
        run: make build-all-platforms

      - name: Generate checksums
        run: cd build && sha256sum slack-mcp-server-* > checksums.txt

      - name: Upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            build/slack-mcp-server-*
            build/checksums.txt
            LICENSE
